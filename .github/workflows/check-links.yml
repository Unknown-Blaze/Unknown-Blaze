# Weekly check that every link and image in the profile README still resolves.
# LinkedIn is excluded because it answers 999 to automated requests.
name: Check links

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["README.md", ".github/workflows/check-links.yml"]

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --exclude "linkedin\.com"
            --accept 200,206,429
            README.md
          fail: true
