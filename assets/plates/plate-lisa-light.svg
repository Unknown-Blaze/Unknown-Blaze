<text x="124.0" y="209.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#57606A" letter-spacing="0.6" text-anchor="middle">WEB FRONT END</text>
<rect x="12" y="240" width="456" height="288" rx="10" fill="none" stroke="#0F766E" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="456" y="262" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#0F766E" font-weight="700" letter-spacing="0.6" text-anchor="end">ALIBABA CLOUD · TERRAFORM</text>
