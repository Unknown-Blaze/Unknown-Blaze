<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc">
<title id="title">LISA 1.0 system plate</title>
<desc id="desc">Users in 4 ASEAN markets use a Next.js 15 app. An API layer backed by PostgreSQL calls retrieval (RAG) over a document store, then an LLM, which returns the answer. Deployed on Alibaba Cloud with Terraform. API latency 300 ms to 50 ms; cloud cost down 70%.</desc>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0 H0 V20" fill="none" stroke="#E6EAEE" stroke-width="1"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606A"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C2410C"/></marker></defs>
<rect x="0.5" y="0.5" width="479" height="639" rx="14" fill="#F6F8FA"/>
<rect x="0.5" y="0.5" width="479" height="639" rx="14" fill="url(#grid)" stroke="#D0D7DE"/>
<text x="24" y="36" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#0F766E" font-weight="700" letter-spacing="1.2">PLATE B · LISA 1.0</text>
<text x="456" y="36" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#57606A" letter-spacing="1" text-anchor="end">MISUMI.AI</text>
<path d="M18 52 H462" stroke="#D0D7DE" stroke-width="1"/>
