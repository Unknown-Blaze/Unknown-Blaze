<text x="356.0" y="493.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#57606A" letter-spacing="0.6" text-anchor="middle">BACK TO THE USER</text>
<circle cx="124.0" cy="528" r="3.6" fill="#C2410C"/>
