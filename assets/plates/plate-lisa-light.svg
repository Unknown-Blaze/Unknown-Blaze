<text x="124.0" y="99.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#1F2328" font-weight="600" text-anchor="middle">Users</text>
<text x="124.0" y="119.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#57606A" letter-spacing="0.6" text-anchor="middle">4 ASEAN MARKETS</text>
<path d="M124.0 134 V158" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="24" y="160" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3"/>
