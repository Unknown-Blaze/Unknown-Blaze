<text x="356.0" y="407.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#57606A" letter-spacing="0.6" text-anchor="middle">INDEXED SOURCES</text>
