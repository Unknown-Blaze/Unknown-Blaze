<svg xmlns="http://www.w3.org/2000/svg" width="480" height="680" viewBox="0 0 480 680" role="img" aria-labelledby="title desc">
<title id="title">MHC-peptide binding prediction pipeline</title>
<desc id="desc">IEDB dataset feeds two branches: a sequence branch with ESM-2 650M fine-tuned with LoRA, and a structure branch with ColabFold/AlphaFold-derived structures turned into graphs for a GNN. An ensemble fuses both to predict binding affinity. PCC 0.859 against 0.847 for the best retrained baseline; submitted to ICLR 2027.</desc>
